name: Dependent Jobs Workflow

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Build Started
        run: echo "Building application..."

      - name: Simulate Build
        run: sleep 5

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Test Started
        run: echo "Running tests..."

      - name: Simulate Testing
        run: sleep 5

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Started
        run: echo "Deploying application..."

      - name: Simulate Deployment
        run: sleep 5
